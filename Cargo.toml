[package]
name = "shotgun-proxy"
version = "0.1.0"
edition = "2021"
description = "Turn any REST API into the shape of another"
license = "MIT"
repository = "https://github.com/ThatXliner/shotgun"
homepage = "https://github.com/ThatXliner/shotgun"
readme = "README.md"
keywords = ["openapi", "proxy", "rest-api", "api-gateway", "reverse-proxy"]
categories = ["command-line-utilities", "web-programming::http-server"]

[lib]
name = "shotgun"

[[bin]]
name = "shotgun"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["clock"] }
url = "2"
http = "1"
futures = "0.3"
bytes = "1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
