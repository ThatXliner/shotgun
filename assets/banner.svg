<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Shotgun — turn any REST API into the shape of another">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1c2130"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8955b" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#e8955b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="320" fill="url(#dots)" opacity="0.5"/>
  <rect x="1" y="1" width="1278" height="318" fill="none" stroke="#232838" stroke-width="1"/>

  <!-- muzzle flash accent -->
  <ellipse cx="220" cy="160" rx="60" ry="30" fill="url(#glow)"/>

  <!-- gun emoji -->
  <text x="90" y="195" font-size="100" text-anchor="middle">🔫</text>

  <!-- arrow showing translation -->
  <g transform="translate(175,160)" stroke="#5ec2c9" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="0" y1="0" x2="60" y2="0"/>
    <polyline points="48,-10 60,0 48,10"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="76" letter-spacing="2" fill="#f3efe6">SHOTGUN</text>

  <!-- tagline -->
  <text x="282" y="197" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9aa4b4">Turn any REST API into the shape of another.</text>

  <!-- caption -->
  <text x="282" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#565f70">openapi → openapi translation proxy</text>
</svg>
