<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Shotgun logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="50.5" fill="none" stroke="#232838" stroke-width="1"/>

  <!-- reticle: source shape (square) resolving into target shape (circle) -->
  <circle cx="128" cy="128" r="72" fill="none" stroke="#e8955b" stroke-width="7"/>
  <circle cx="128" cy="128" r="46" fill="none" stroke="#5ec2c9" stroke-width="5"/>
  <circle cx="128" cy="128" r="7" fill="#f3efe6"/>

  <!-- crosshair ticks -->
  <g stroke="#e8955b" stroke-width="7" stroke-linecap="round">
    <line x1="128" y1="34" x2="128" y2="54"/>
    <line x1="128" y1="202" x2="128" y2="222"/>
    <line x1="34" y1="128" x2="54" y2="128"/>
    <line x1="202" y1="128" x2="222" y2="128"/>
  </g>
</svg>
