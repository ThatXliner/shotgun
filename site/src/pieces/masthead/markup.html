        <div class="masthead-content">

          <span class="eyebrow"><b>OpenAPI</b> → <b>OpenAPI</b> translation proxy</span>
          <h1>Turn any REST API into the shape of another.</h1>
          <p class="sub">Shotgun is a reverse proxy generator for OpenAPI specs.</p>
          <div class="cta">
            <a class="btn primary" href="#quickstart">Get started</a>
            <button class="copyline" data-copy="cargo install shotgun-proxy" type="button" aria-label="Copy install command: cargo install shotgun-proxy">

            </button>
          </div>

            <span>Deterministic matching</span>
            <span>Rust + axum</span>
